# Adds the `app` service (the dev container) next to the databases of
# ../docker-compose.yml. Paths here are relative to that primary file.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm
    # keep the container alive; VS Code / the CLI attach to it
    command: sleep infinity
    volumes:
      - .:/workspaces/fastify-api-template:cached
    environment:
      # Inside the compose network the databases are reached by service name and
      # their container ports (not the host ports of ../docker-compose.yml).
      DATABASE_URL: postgres://docker:docker@postgres:5432/app
      TEST_DATABASE_URL: postgres://docker:docker@postgres:5432/app_test
      # Mongo announces `localhost:27018` in its replica set, which is not
      # reachable from here, so connect to the node directly (transactions work).
      TEST_MONGODB_URI: mongodb://mongo:27018/?directConnection=true
      TEST_REDIS_URL: redis://redis:6379/15
      # Use the same values (hostnames above) in .env for `pnpm dev` with Mongo/Redis:
      #   MONGODB_URI=mongodb://mongo:27018/?directConnection=true
      #   REDIS_URL=redis://redis:6379
